apiVersion: lorenz.ai/v1alpha1
kind: Skill
metadata:
  namespace: lorenz
  name: strategy-designer
  version: 1.0.0-alpha.1
  title: Strategy Designer
  description: Turns an eligible evidence-backed trading hypothesis into an auditable, owner-confirmable draft StrategySpec
    without execution authority.
  annotations: {lorenz.ai/tier: trading, lorenz.ai/status: experimental, lorenz.ai/input-contract: lorenz.trading/evidence-bundle/v1alpha1,
    lorenz.ai/provenance-status: source-commit-pinned}
spec:
  skillType: prompt
  license: Apache-2.0
  source: {repository: 'https://github.com/bibop/Lorenz', commitSha: 'd1161f0c7976670032d47387184be63fb4036c47', subdirectory: examples/skills/strategy-designer}
  entrypoint: SKILL.md
  artifacts:
  - {path: SKILL.md, digest: 'sha256:bbb39b29b6cea5896999391e501651e0b2728bf5b8917fa0267ea6f030142b68', mediaType: text/markdown,
    role: entrypoint}
  - {path: schemas/input.schema.json, digest: 'sha256:2fd6ad1f91f2ae32783b32ca4d9b44d8935fb4bb013156d27ec94ffadaf7f364', mediaType: application/schema+json,
    role: documentation}
  - {path: schemas/output.schema.json, digest: 'sha256:f052c2013a64d104c5441fe00ebf12181780d36ed1dfa4184e34d2744a96a5aa',
    mediaType: application/schema+json, role: documentation}
  - {path: tests/golden.json, digest: 'sha256:0c39508da0e0c6f5e3946f89bd9e6e27b295531f5a949b510389d3317eb95385', mediaType: application/json,
    role: test}
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $id: https://schemas.lorenz.ai/skills/strategy-designer/input/v1alpha1
    title: StrategyDesignerInput
    type: object
    additionalProperties: false
    required: [request, evidenceBundle, universe, immutablePolicies]
    properties:
      request: {type: string, minLength: 1, maxLength: 4000}
      evidenceBundle: {$ref: '#/$defs/evidenceBundle'}
      universe: {$ref: '#/$defs/universe'}
      immutablePolicies: {$ref: '#/$defs/immutablePolicies'}
      requestedModelFamilies:
        type: array
        maxItems: 12
        uniqueItems: true
        items: {$ref: '#/$defs/modelFamily'}
    $defs:
      digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      modelFamily:
        enum: [baseline_cash, benchmark, ridge, elastic_net, robust_linear, lightgbm, causal_tcn, tcn_attention, compact_transformer,
          ensemble]
      evidenceBundle:
        type: object
        additionalProperties: false
        required: [schemaVersion, digest, disposition, claimIds, hypotheses]
        properties:
          schemaVersion: {const: lorenz.trading/evidence-bundle/v1alpha1}
          digest: {$ref: '#/$defs/digest'}
          disposition:
            enum: [READY_FOR_STRATEGY_DESIGN, NEEDS_MORE_EVIDENCE, REJECTED]
          claimIds:
            type: array
            maxItems: 500
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 160}
          hypotheses:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [hypothesisId, kind, statement, status, evidenceStrength, evidenceClaimIds]
              properties:
                hypothesisId: {type: string, minLength: 1, maxLength: 160}
                kind:
                  enum: [STRATEGY_CANDIDATE, FAILURE_MODE]
                statement: {type: string, minLength: 1, maxLength: 3000}
                status: {const: UNTESTED}
                evidenceStrength:
                  enum: [TIER_1, TIER_1_AND_2, TIER_2_WITH_LIMITATIONS, TIER_3_ONLY]
                evidenceClaimIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 160}
              allOf:
              - if:
                  properties:
                    kind: {const: STRATEGY_CANDIDATE}
                  required: [kind]
                then:
                  properties:
                    evidenceStrength:
                      enum: [TIER_1, TIER_1_AND_2, TIER_2_WITH_LIMITATIONS]
              - if:
                  properties:
                    evidenceStrength: {const: TIER_3_ONLY}
                  required: [evidenceStrength]
                then:
                  properties:
                    kind: {const: FAILURE_MODE}
        allOf:
        - if:
            properties:
              disposition: {const: READY_FOR_STRATEGY_DESIGN}
            required: [disposition]
          then:
            properties:
              hypotheses:
                contains:
                  type: object
                  required: [kind, evidenceStrength]
                  properties:
                    kind: {const: STRATEGY_CANDIDATE}
                    evidenceStrength:
                      enum: [TIER_1, TIER_1_AND_2, TIER_2_WITH_LIMITATIONS]
                minContains: 1
      universe:
        type: object
        additionalProperties: false
        required: [universeId, digest, symbols, notBefore]
        properties:
          universeId: {const: us_liquid_etf_20_v2}
          digest: {$ref: '#/$defs/digest'}
          symbols:
            const: [SPY, QQQ, IWM, DIA, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, VOX, VNQ, MDY, VUG, VTV, IWF, IWD]
          notBefore: {const: '2016-01-04'}
      immutablePolicies:
        type: object
        additionalProperties: false
        required: [riskPolicyDigest, costModelDigest, benchmarkDigest, evaluatorDigest, assetClass, longOnly, leverageAllowed,
          shortAllowed, optionsAllowed, cryptoAllowed, maxGross, maxPosition, targetVolatility, noTradeAllowed, earliestExecution]
        properties:
          riskPolicyDigest: {$ref: '#/$defs/digest'}
          costModelDigest: {$ref: '#/$defs/digest'}
          benchmarkDigest: {$ref: '#/$defs/digest'}
          evaluatorDigest: {$ref: '#/$defs/digest'}
          assetClass: {const: us_equity_etf}
          longOnly: {const: true}
          leverageAllowed: {const: false}
          shortAllowed: {const: false}
          optionsAllowed: {const: false}
          cryptoAllowed: {const: false}
          maxGross: {const: 0.5}
          maxPosition: {const: 0.1}
          targetVolatility: {const: 0.08}
          noTradeAllowed: {const: true}
          earliestExecution: {const: next_session}
  outputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    $id: https://schemas.lorenz.ai/skills/strategy-designer/output/v1alpha1
    title: StrategyDesignerOutput
    type: object
    additionalProperties: false
    required: [schemaVersion, evidenceGate, decision, strategySpec, confirmation, warnings, openQuestions]
    properties:
      schemaVersion: {const: lorenz.trading/strategy-design/v1alpha1}
      evidenceGate:
        enum: [ELIGIBLE_STRATEGY_EVIDENCE, TIER_3_ONLY_FAILURE_MODE, INSUFFICIENT_EVIDENCE]
      decision:
        enum: [READY_FOR_OWNER_CONFIRMATION, NEEDS_REVISION, INSUFFICIENT_EVIDENCE]
      strategySpec:
        oneOf:
        - {$ref: '#/$defs/strategySpec'}
        - {type: 'null'}
      confirmation: {$ref: '#/$defs/confirmation'}
      warnings:
        type: array
        maxItems: 100
        items: {type: string, maxLength: 1000}
      openQuestions:
        type: array
        maxItems: 100
        items: {type: string, maxLength: 1000}
    allOf:
    - if:
        properties:
          decision: {const: READY_FOR_OWNER_CONFIRMATION}
        required: [decision]
      then:
        properties:
          evidenceGate: {const: ELIGIBLE_STRATEGY_EVIDENCE}
          strategySpec: {$ref: '#/$defs/strategySpec'}
    - if:
        properties:
          decision: {const: INSUFFICIENT_EVIDENCE}
        required: [decision]
      then:
        properties:
          strategySpec: {type: 'null'}
    - if:
        properties:
          evidenceGate: {const: TIER_3_ONLY_FAILURE_MODE}
        required: [evidenceGate]
      then:
        properties:
          decision: {const: INSUFFICIENT_EVIDENCE}
          strategySpec: {type: 'null'}
    $defs:
      digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      modelFamily:
        enum: [baseline_cash, benchmark, ridge, elastic_net, robust_linear, lightgbm, causal_tcn, tcn_attention, compact_transformer,
          ensemble]
      baselineModelFamily:
        enum: [baseline_cash, benchmark]
      strategySpec:
        type: object
        additionalProperties: false
        required: [specVersion, name, qualificationStatus, researchTrace, universe, target, featureGroups, modelLane, signalPolicy,
          executionAssumptions, allocationConstraints, immutablePolicyRefs, assumptions, falsificationCriteria, failureModes]
        properties:
          specVersion: {const: lorenz.trading/strategy-spec/v1alpha1}
          name: {type: string, minLength: 1, maxLength: 160}
          qualificationStatus: {const: DRAFT_UNCONFIRMED}
          researchTrace:
            type: object
            additionalProperties: false
            required: [evidenceBundleDigest, hypothesisId, claimIds]
            properties:
              evidenceBundleDigest: {$ref: '#/$defs/digest'}
              hypothesisId: {type: string, minLength: 1, maxLength: 160}
              claimIds:
                type: array
                minItems: 1
                maxItems: 100
                uniqueItems: true
                items: {type: string, minLength: 1, maxLength: 160}
          universe:
            type: object
            additionalProperties: false
            required: [universeId, digest, symbols]
            properties:
              universeId: {const: us_liquid_etf_20_v2}
              digest: {$ref: '#/$defs/digest'}
              symbols:
                const: [SPY, QQQ, IWM, DIA, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, VOX, VNQ, MDY, VUG, VTV, IWF, IWD]
          target:
            type: object
            additionalProperties: false
            required: [primary, auxiliary]
            properties:
              primary: {const: five_session_excess_return}
              auxiliary:
                const: [one_session_excess_return, twenty_session_excess_return]
          featureGroups:
            type: array
            minItems: 1
            maxItems: 16
            uniqueItems: true
            items:
              enum: [returns, relative_returns, momentum, reversal, volatility, downside_volatility, volume, turnover, spread_proxy,
                beta, correlation, dispersion, breadth, drawdown, regime]
          modelLane:
            type: object
            additionalProperties: false
            required: [family, role, baselineFamilies]
            properties:
              family: {$ref: '#/$defs/modelFamily'}
              role:
                enum: [BASELINE, CHALLENGER]
              baselineFamilies:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items: {$ref: '#/$defs/baselineModelFamily'}
            allOf:
            - if:
                properties:
                  family:
                    enum: [ridge, elastic_net, robust_linear, lightgbm, causal_tcn, tcn_attention, compact_transformer, ensemble]
                required: [family]
              then:
                properties:
                  role: {const: CHALLENGER}
            - if:
                properties:
                  role: {const: BASELINE}
                required: [role]
              then:
                properties:
                  family:
                    enum: [baseline_cash, benchmark]
          signalPolicy:
            type: object
            additionalProperties: false
            required: [noTradeAllowed, confidenceRule, abstentionRule]
            properties:
              noTradeAllowed: {const: true}
              confidenceRule: {type: string, minLength: 1, maxLength: 1000}
              abstentionRule: {type: string, minLength: 1, maxLength: 1000}
          executionAssumptions:
            type: object
            additionalProperties: false
            required: [historicalFeed, decisionTiming, earliestExecution, sameCloseAllowed, overnightTradingAllowed, fractionalOrdersAllowed]
            properties:
              historicalFeed: {const: sip}
              decisionTiming: {const: after_close_t}
              earliestExecution: {const: next_session}
              sameCloseAllowed: {const: false}
              overnightTradingAllowed: {const: false}
              fractionalOrdersAllowed: {const: false}
          allocationConstraints:
            type: object
            additionalProperties: false
            required: [longOnly, leverageAllowed, shortAllowed, optionsAllowed, cryptoAllowed, maxGross, maxPosition, targetVolatility]
            properties:
              longOnly: {const: true}
              leverageAllowed: {const: false}
              shortAllowed: {const: false}
              optionsAllowed: {const: false}
              cryptoAllowed: {const: false}
              maxGross: {type: number, exclusiveMinimum: 0, maximum: 0.5}
              maxPosition: {type: number, exclusiveMinimum: 0, maximum: 0.1}
              targetVolatility: {type: number, exclusiveMinimum: 0, maximum: 0.08}
          immutablePolicyRefs:
            type: object
            additionalProperties: false
            required: [riskPolicyDigest, costModelDigest, benchmarkDigest, evaluatorDigest]
            properties:
              riskPolicyDigest: {$ref: '#/$defs/digest'}
              costModelDigest: {$ref: '#/$defs/digest'}
              benchmarkDigest: {$ref: '#/$defs/digest'}
              evaluatorDigest: {$ref: '#/$defs/digest'}
          assumptions:
            type: array
            minItems: 1
            maxItems: 100
            items: {type: string, minLength: 1, maxLength: 1000}
          falsificationCriteria:
            type: array
            minItems: 1
            maxItems: 100
            items: {type: string, minLength: 1, maxLength: 1000}
          failureModes:
            type: array
            minItems: 1
            maxItems: 100
            items: {type: string, minLength: 1, maxLength: 1000}
      confirmation:
        type: object
        additionalProperties: false
        required: [required, status, summary, assumptionDiffs]
        properties:
          required: {const: true}
          status: {const: NOT_CONFIRMED}
          summary: {type: string, minLength: 1, maxLength: 3000}
          assumptionDiffs:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [requested, applied, reason]
              properties:
                requested: {type: string, minLength: 1, maxLength: 1000}
                applied: {type: string, minLength: 1, maxLength: 1000}
                reason: {type: string, minLength: 1, maxLength: 1000}
  requiredCapabilities: []
  dataScopes: []
  egressDestinations: []
  secretRefs: []
  sideEffects: [none]
  approval:
    requiredFor: []
  sandbox: {profile: prompt_only, readOnlyRoot: true, networkDisabledByDefault: true}
  resources: {maxDurationSeconds: 180, maxMemoryMb: 256, maxDiskMb: 0, maxProcesses: 32, maxOutputBytes: 750000}
  supportedPlatforms:
  - {os: linux, architecture: x86_64}
  - {os: linux, architecture: arm64}
  - {os: macos, architecture: x86_64}
  - {os: macos, architecture: arm64}
  tests: [tests/golden.json]
